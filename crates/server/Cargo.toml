[package]
name = "p9draw-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Observation tooling for the plan9port devdraw wire protocol: unix-socket logger, MITM capture (socket + legacy pipe), raw dumps"

[dependencies]
p9draw-protocol = { path = "../protocol" }
p9draw-render = { path = "../render" }
p9draw-host = { path = "../host" }

# screen.rs logic is std-only; p9draw-host pulls winit/softbuffer for the
# real window (needed by the serve subcommand only).
